# SonarQube/SonarScanner 配置文件
# 用于扫描 xuanjiao-backend Java 代码质量

# 项目基本信息
sonar.projectKey=xuanjiao-backend
sonar.projectName=xuanjiao-backend
sonar.projectVersion=1.0

# 源代码路径（使用相对路径）
sonar.sources=xuanjiao-backend/xuanjiao-adapter/src/main/java,xuanjiao-backend/xuanjiao-app/src/main/java,xuanjiao-backend/xuanjiao-client/src/main/java,xuanjiao-backend/xuanjiao-domain/src/main/java,xuanjiao-backend/xuanjiao-infrastructure/src/main/java,xuanjiao-backend/xuanjiao-start/src/main/java,xuanjiao-backend/xuanjiao-common/src/main/java

# Java 配置
sonar.java.source=8
sonar.java.target=8
sonar.java.binaries=xuanjiao-backend/*/target/classes

# 排除不需要分析的文件和目录
sonar.exclusions=**/target/**,**/node_modules/**,**/*.generated.*,**/generated/**,**/src/test/**
sonar.test.exclusions=**/target/**,**/generated/**

# 编码
sonar.sourceEncoding=UTF-8

# 语言
sonar.language=java

# 本地分析模式（可选：如有 SonarQube 服务器，可删除此行）
# sonar.scanner.sonarcloud.home=${SONAR_USER_HOME}

# 质量配置（可选）
# sonar.qualityProfile=Sonar_way
