# SonarQube 项目配置文件
# 文档: https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# 项目基本配置
sonar.projectKey=xuanjiao-backend
sonar.projectName=宣传教育平台-后端
sonar.projectVersion=1.0.0-SNAPSHOT

# 代码源码位置（多模块项目）
sonar.sources=.
sonar.modules=xuanjiao-client,xuanjiao-domain,xuanjiao-app,xuanjiao-infrastructure,xuanjiao-adapter,xuanjiao-start

# 排除不需要扫描的文件和目录
sonar.exclusions=\
  **/target/**,\
  **/node_modules/**,\
  **/.mvn/**,\
  **/mvnw,\
  **/mvnw.cmd

# Java 配置
sonar.java.source=8
sonar.java.target=8
sonar.sourceEncoding=UTF-8

# 代码覆盖率配置（如果有单元测试）
# sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
# sonar.java.coveragePlugin=jacoco

# 排除生成的代码
sonar.java.binaries=target/classes
sonar.java.libraries=target/lib

# 代码质量规则配置
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# 中文支持
sonar.scm.encoding=UTF-8

# 排除 Lombok 生成的代码
sonar.java.lombok=enabled
